<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800">
  <rect width="1400" height="1800" fill="#f7f1df"/>
  <rect x="55" y="55" width="1290" height="1690" fill="none" stroke="#171d24" stroke-width="10"/>
  <rect x="82" y="82" width="1236" height="1636" fill="none" stroke="#171d24" stroke-width="2"/>
  <text x="700" y="205" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700">45% Alc./Vol.</text>
  <text x="700" y="420" text-anchor="middle" font-family="Georgia" font-size="92" font-weight="700">OLD TOM DISTILLERY</text>
  <line x1="220" y1="490" x2="1180" y2="490" stroke="#171d24" stroke-width="3"/>
  <text x="700" y="610" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700">750 mL</text>
  <text x="700" y="745" text-anchor="middle" font-family="Arial" font-size="43">Kentucky Straight Bourbon Whiskey</text>
  <text x="700" y="850" text-anchor="middle" font-family="Arial" font-size="30">BOTTLED BY OLD TOM DISTILLERY, FRANKFORT, KENTUCKY</text>
  <rect x="125" y="1000" width="1150" height="490" fill="#fff" stroke="#171d24" stroke-width="4"/>
  <text x="160" y="1070" font-family="Arial" font-size="31" font-weight="700">GOVERNMENT WARNING:</text>
  <text x="160" y="1120" font-family="Arial" font-size="31">(1) According to the Surgeon General, women should not</text>
  <text x="160" y="1164" font-family="Arial" font-size="31">drink alcoholic beverages during pregnancy because of the</text>
  <text x="160" y="1208" font-family="Arial" font-size="31">risk of birth defects. (2) Consumption of alcoholic beverages</text>
  <text x="160" y="1252" font-family="Arial" font-size="31">impairs your ability to drive a car or operate machinery, and</text>
  <text x="160" y="1296" font-family="Arial" font-size="31">may cause health problems.</text>
</svg>
