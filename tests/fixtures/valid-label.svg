<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800">
  <rect width="1400" height="1800" fill="#f7f1df"/>
  <rect x="55" y="55" width="1290" height="1690" fill="none" stroke="#171d24" stroke-width="10"/>
  <rect x="82" y="82" width="1236" height="1636" fill="none" stroke="#171d24" stroke-width="2"/>
  <text x="700" y="205" text-anchor="middle" font-family="Arial" font-size="46" font-weight="700" letter-spacing="12">HANDCRAFTED IN KENTUCKY</text>
  <text x="700" y="400" text-anchor="middle" font-family="Georgia" font-size="120" font-weight="700">OLD TOM</text>
  <text x="700" y="505" text-anchor="middle" font-family="Arial" font-size="64" font-weight="700" letter-spacing="16">DISTILLERY</text>
  <line x1="220" y1="565" x2="1180" y2="565" stroke="#171d24" stroke-width="3"/>
  <text x="700" y="680" text-anchor="middle" font-family="Arial" font-size="48">Kentucky Straight</text>
  <text x="700" y="745" text-anchor="middle" font-family="Arial" font-size="48">Bourbon Whiskey</text>
  <text x="700" y="875" text-anchor="middle" font-family="Georgia" font-size="38" font-style="italic">Bottled by Old Tom Distillery · Louisville, KY</text>
  <text x="260" y="1015" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700">45% Alc./Vol.</text>
  <text x="700" y="1015" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700">90 Proof</text>
  <text x="1135" y="1015" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700">750 mL</text>
  <rect x="125" y="1110" width="1150" height="490" fill="#fff" stroke="#171d24" stroke-width="4"/>
  <text x="160" y="1180" font-family="Arial" font-size="31" font-weight="700">GOVERNMENT WARNING:</text>
  <text x="160" y="1230" font-family="Arial" font-size="31">(1) According to the Surgeon General, women should not</text>
  <text x="160" y="1274" font-family="Arial" font-size="31">drink alcoholic beverages during pregnancy because of the</text>
  <text x="160" y="1318" font-family="Arial" font-size="31">risk of birth defects. (2) Consumption of alcoholic beverages</text>
  <text x="160" y="1362" font-family="Arial" font-size="31">impairs your ability to drive a car or operate machinery, and</text>
  <text x="160" y="1406" font-family="Arial" font-size="31">may cause health problems.</text>
  <text x="700" y="1665" text-anchor="middle" font-family="Arial" font-size="24" letter-spacing="6">SMALL BATCH · BARREL AGED</text>
</svg>
